<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>
    <nav class="navbar">
        <span>ShopEase</span>
        <div class="navlinks">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Deals</a>
            <a href="#">About</a>
        </div>
        <a href="#" class="cartbtn">Cart (3)</a>
    </nav>
    <div class="main">
        <div class="filter">
            <h3>Filter</h3>
            <a href="#" class="allfilter">All</a>
            <a href="#" class="otherfilter">Men</a>
            <a href="#" class="otherfilter">Women</a>
            <a href="#" class="otherfilter">Kids</a>
            <a href="#" class="otherfilter">Electronics</a>
        </div>
        <div class="products">
            <div class="imagecontainer"></div>
            <span class="badge">New</span>
            <h3 class="productname">Wireless Headphones</h3>
            <h3 class="productprice">$49.99</h3>
            <a href="#" class="addtocartbtn">Add to Cart</a>
        </div>
        <div class="products">
            <div class="imagecontainer"></div>
            <h3 class="productname">Running Shoes</h3>
            <h3 class="productprice">$79.99</h3>
            <a href="#" class="addtocartbtn">Add to Cart</a>
        </div>
        <div class="products">
            <div class="imagecontainer"></div>
            <span class="badge">Sale</span>
            <h3 class="productname">Smart Watch</h3>
            <h3 class="productprice">$129.99</h3>
            <a href="#" class="addtocartbtn">Add to Cart</a>
        </div>
    </div>
</body>
</html>
