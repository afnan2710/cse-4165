<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="q1.css">
</head>

<body>
    <nav class="navbar">
        <h2>CORE-TECH</h2>
        <div class="navlinks">
            <a href="#">OVERVIEW</a>
            <a href="#">ANALYTICS</a>
            <a href="#">REPORT</a>
            <a href="#">SECURITY</a>
        </div>
        <h4>Admin: System_Root</h4>
    </nav>
    <div class="stat">
        <div class="card">
            <h3>Total Users</h3>
            <h1>12,450</h1>
            <h4>UP + 12% Monthly</h4>
        </div>
        <div class="card" style="background-color: #378b3b;">
            <h3>Revenue</h3>
            <h1>$84,200</h1>
            <h4>UP + 5.2% Weekly</h4>
        </div>
        <div class="card" style="background-color: #f78100;">
            <h3>Active Tasks</h3>
            <h1>18</h1>
            <h4>4 Task Pending</h4>
        </div>
        <div class="card" style="background-color: #781fa0;">
            <h3>System Health</h3>
            <h1>99.9%</h1>
            <h4>System Stable</h4>
        </div>
    </div>

    <div class="lower">
        <div class="config">
            <h3 style="border-bottom: 1px solid black; width: 50%; margin-bottom: 10px; padding: 10px 10px;">System
                Configuration</h3>
            <form action="#" class="form">
                <div class="leftform">
                    <label>Server Name</label><br>
                    <input type="text" placeholder="Enter Server Alias..."><br>
                    <label>Deployment Zone</label><br>
                    <select name="" id="">
                        <option value="">North America (East)</option>
                    </select>
                </div>

                <label for="">System Description</label>
                <textarea name="" id="" rows="4"></textarea>
            </form>
        </div>

        <div class="permission">
            <h3 style="border-bottom: 1px solid black; width: 50%; margin-bottom: 10px; padding: 10px 10px;">Access
                Permissions</h3>
            <div class="flex">
                <div class="c1">
                    <input type="checkbox">
                    <label for="">Red</label>

                </div>
                <div class="c1">
                    <input type="checkbox">
                    <label for="">Write</label>
                </div>
                <div class="c1">
                    <input type="checkbox">
                    <label for="">Delete</label>
                </div>
                <div class="c1">
                    <input type="checkbox">
                    <label for="">Api</label>

                </div>
            </div>
            <div class="btn">
                <a href="#">Update Settings</a>
                <a href="#" style="background-color: #6c757d;">Reset</a>
            </div>

        </div>
    </div>
</body>

</html>
